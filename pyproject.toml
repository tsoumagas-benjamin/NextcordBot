[project]
name = "chaos-bot"
version = "0.1.0"
description = "Multi-purpose Stoat bot"
authors = [
    {name = "ChaosHerald2"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles (>=25.1.0,<26.0.0)",
    "aiohappyeyeballs (>=2.7.1,<3.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "aiosignal (>=1.4.0,<2.0.0)",
    "anyio (>=4.14.2,<5.0.0)",
    "attrs (>=26.1.0,<27.0.0)",
    "certifi (>=2026.7.22,<2027.0.0)",
    "contourpy (>=1.3.3,<2.0.0)",
    "cycler (>=0.12.1,<0.13.0)",
    "fonttools (>=4.63.0,<5.0.0)",
    "frozenlist (>=1.8.0,<2.0.0)",
    "h11 (>=0.16.0,<0.17.0)",
    "httpcore (>=1.0.9,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "humanfriendly (>=10.0,<11.0)",
    "idna (>=3.18,<4.0)",
    "kiwisolver (>=1.5.0,<2.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "multidict (>=6.7.1,<7.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "packaging (>=26.2,<27.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "propcache (>=0.5.2,<0.6.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "pyparsing (>=3.3.2,<4.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pytz (>=2026.3.post1,<2027.0)",
    "six (>=1.17.0,<2.0.0)",
    "stoat-py (>=1.2.1,<2.0.0)",
    "yarl (>=1.24.5,<2.0.0)",
    "yt-search-python (>=2.1.1,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
